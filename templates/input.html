{% extends "base.html" %}

{% block title %}Input Form{% endblock %}

{% block head_extra %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("input-form").addEventListener("submit", function (event) {
            event.preventDefault(); // cegah submit dulu
            let valid = true;
            let nama = document.getElementById("nama").value;
            let umur = document.getElementById("umur").value;
            let alamat = document.getElementById("alamat").value;

            // Reset error (assuming error spans exist, if not, they need to be added)
            document.querySelectorAll(".error-message").forEach(e => e.innerText = "");

            if (nama === "") {
                // Example: document.getElementById("error-nama").innerText = "Nama wajib diisi!";
                valid = false;
            }

            if (umur === "") {
                // Example: document.getElementById("error-umur").innerText = "Umur wajib diisi!";
                valid = false;
            }

            if (alamat === "") {
                // Example: document.getElementById("error-alamat").innerText = "Alamat wajib diisi!";
                valid = false;
            }

            if (valid) {
                document.getElementById("popup").style.display = "flex";
                this.reset(); // kosongkan form
            </div >
        });
    });

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }
</script>
{% endblock %}

{% block content_header %}
<h1>📝 Input Data Profil</h1>
<p>Lengkapi form di bawah untuk memperbarui informasi data diri.</p>
{% endblock %}

{% block content %}
<div class="stats-grid" style="justify-content: center;">
    <div class="card" style="max-width: 600px; margin: 0;">
        <form id="input-form" action="/input-form" method="post">
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" required>
            </div>
            <div class="form-group">
                <label for="umur">Umur</label>
                <input type="number" id="umur" name="umur" required>
            </div>
            <div class="form-group">
                <label for="alamat">Alamat</label>
                <input type="text" id="alamat" name="alamat" required>
            </div>
            <button type="submit">Kirim Data</button>
        </form>
    </div>

    <!-- Popup validation -->
    <div class="popup" id="popup" style="display: none;">
        <div class="popup-content">
            <h2>✅ Data berhasil dikirim!</h2>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>
</div>
{% endblock %}
