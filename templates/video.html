{% extends "base.html" %}

{% block title %}Video Player{% endblock %}

{% block content_header %}
    <h1>🎬 Video Player</h1>
    <p>Tonton video menarik yang disematkan di sini.</p>
{% endblock %}

{% block content %}
<div class="stats-grid">
    <div class="card" style="max-width: 800px; margin: 0;">
        <h3>Video Contoh</h3>
        <p style="margin-bottom: 20px;">Video ini disematkan dari sumber eksternal.</p>
        <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0;">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 16px;"></iframe>
        </div>
    </div>
</div>
{% endblock %}
