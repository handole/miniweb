<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Edit Siswa</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Edit Siswa</h1>
    <form method="POST">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" value="{{ siswa['nama'] }}" required><br>

        <label for="umur">Umur:</label>
        <input type="number" id="umur" name="umur" value="{{ siswa['umur'] }}" required><br>

        <label for="kelas">Kelas:</label>
        <input type="text" id="kelas" name="kelas" value="{{ siswa['kelas'] }}" required><br>

        <label for="alamat">Alamat:</label>
        <input type="text" id="alamat" name="alamat" value="{{ siswa['alamat'] }}" required><br>

        <button type="submit">Simpan</button>
    </form>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flash-messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
</body>
</html>
