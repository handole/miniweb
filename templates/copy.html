<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
    <div style="width:100%">
    <h1>Data Siswa</h1>
    <form method="POST" class="form-siswa">
        <div class="form-group">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" required>
        </div>
        <div class="form-group">
            <label for="umur">Umur:</label>
            <input type="text" name="umur" id="umur" required>
        </div>
        <div class="form-group">
            <label for="kelas">Kelas:</label>
            <input type="text" name="kelas" id="kelas" required>
        </div>
        <div class="form-group">
            <label for="alamat">Alamat:</label>
            <input type="text" name="alamat" id="alamat" required>
        </div>
        <button type="submit" class="btn-tambah">Tambah</button>
    </form>
    <br>
    <!-- <ul>
        {% for siswa in data_siswa %}
            <li><b>{{ loop.index }}.</b>
                <p>Nama: {{ siswa.nama }}</p>
                <p>Umur: {{ siswa.umur }}</p>
                <p>Kelas: {{ siswa.kelas }}</p>
                <p>Alamat: {{ siswa.alamat }}</p>
            </li>
        {% endfor %}
    </ul> -->
    <div style="overflow-x:auto;">
    <table class="tabel-siswa">
        <tr>
            <th>No.</th>
            <th>Nama</th>
            <th>Umur</th>
            <th>Kelas</th>
            <th>Alamat</th>
            <th>Action</th>
        </tr>
        {% for siswa in data %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ siswa.nama }}</td>
            <td>{{ siswa.umur }}</td>
            <td>{{ siswa.kelas }}</td>
            <td>{{ siswa.alamat }}</td>
            <td><a href="/hapus-siswa/{{loop.index0}}">Hapus</a>|
                <a href="/sort-siswa">Sort</a>
                <a href="/copy-siswa">Copy</a>
                <a href="/clear-siswa">Clear</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    </div>
    </div>
    </div>
</body>
</html>
